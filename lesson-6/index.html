<style>
:root{
  --em9:#053b2e; --em8:#065f46; --em7:#047857; --em6:#059669; --em5:#10b981; --em1:#d1fae5; --em0:#ecfdf5;
  --gold:#c9972c; --gold2:#e9c46a; --gold0:#fdf6e3;
  --ink:#10221c; --muted:#5b6f67; --line:#dbe9e2;
  --ok:#16a34a; --bad:#dc2626; --rose:#e8789a;
  --card:#ffffff; --bg:#f3faf6;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;overflow-x:hidden;
  background-image:radial-gradient(circle at 10% 0%,#e3f6ec 0,transparent 40%),radial-gradient(circle at 100% 30%,#fbf3dc 0,transparent 35%);background-attachment:fixed}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}

/* Header */
header{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,var(--em9),var(--em7));color:#fff;box-shadow:0 4px 18px rgba(5,59,46,.25)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--gold2);background:#000;flex-shrink:0}
.brand h1{font-size:1.05rem;font-weight:900;line-height:1.2}
.brand p{font-size:.78rem;color:#c8f3df;font-weight:700}
.hbtns{display:flex;gap:6px;flex-shrink:0}
.hbtn{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);font-size:.8rem;font-weight:700;color:#fff;text-decoration:none;transition:.2s}
.hbtn:hover{background:rgba(255,255,255,.25)}
.hbtn svg{width:16px;height:16px}
.hbtn.wa{background:#25d366;border-color:#25d366}
@media(max-width:520px){.hbtn .t{display:none}.hbtn{padding:8px}}

/* Lesson banner */
.banner{margin:18px 0 6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 20px rgba(6,95,70,.06)}
.banner .num{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#3b2a06;font-weight:900;font-size:1.5rem;display:grid;place-items:center;flex-shrink:0}
.banner small{color:var(--gold);font-weight:800;font-size:.8rem}
.banner h2{font-size:1.2rem;font-weight:900;color:var(--em8);line-height:1.5}

/* Menu */
.menu-title{margin:18px 0 10px;font-weight:900;font-size:1.05rem;color:var(--em9);display:flex;align-items:center;gap:8px}
.menu-title:before{content:"";width:6px;height:22px;border-radius:4px;background:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:28px}
.gcard{position:relative;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;gap:14px;align-items:center;transition:transform .2s,box-shadow .2s;overflow:hidden}
.gcard:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(6,95,70,.12)}
.gcard:active{transform:scale(.98)}
.gcard .ic{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;font-size:1.9rem;flex-shrink:0}
.gcard h3{font-size:1.05rem;font-weight:900;color:var(--ink)}
.gcard p{font-size:.82rem;color:var(--muted);line-height:1.6;margin-top:2px}
.gcard .tag{display:inline-block;margin-top:6px;font-size:.72rem;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--em0);color:var(--em7)}

/* Game screen */
#game{display:none;padding-bottom:30px}
.gbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 10px}
.gbar .back{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:var(--em8);background:var(--card);border:1px solid var(--line);padding:7px 12px;border-radius:999px;font-size:.85rem}
.gbar .gt{font-weight:900;color:var(--em9);font-size:1.05rem;display:flex;align-items:center;gap:6px}
.chips{display:flex;gap:6px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-weight:800;font-size:.82rem;white-space:nowrap}
.chip.ok{color:var(--ok)} .chip.bad{color:var(--bad)}
.prog{height:8px;background:#e2efe8;border-radius:99px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--em5),var(--gold2));transition:width .4s}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;font-size:1.15rem;font-weight:800;line-height:1.8;text-align:center;box-shadow:0 6px 18px rgba(6,95,70,.06);margin-bottom:12px;position:relative}
.qbox .qn{position:absolute;top:-11px;right:16px;background:var(--em7);color:#fff;font-size:.72rem;padding:2px 10px;border-radius:99px}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* Feedback toast */
#fb{position:fixed;left:50%;top:84px;transform:translate(-50%,-20px);opacity:0;z-index:80;pointer-events:none;transition:.25s;padding:10px 18px;border-radius:14px;font-weight:900;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:92vw;text-align:center;line-height:1.7}
#fb.show{opacity:1;transform:translate(-50%,0)}
#fb.ok{background:var(--ok)} #fb.bad{background:var(--bad)}
#fb small{display:block;font-weight:700;font-size:.85rem;opacity:.95}

/* Option buttons (shared) */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:800;font-size:1rem;line-height:1.6;text-align:right;display:flex;gap:10px;align-items:center;transition:.15s}
.opt:hover{border-color:var(--em5);background:var(--em0)}
.opt .k{width:30px;height:30px;border-radius:9px;background:var(--em0);color:var(--em7);display:grid;place-items:center;font-weight:900;flex-shrink:0}
.opt.right{border-color:var(--ok);background:#dcfce7}
.opt.wrong{border-color:var(--bad);background:#fee2e2}
.opt[disabled]{cursor:default}

/* Arena (bubbles / shooting) */
.arena{position:relative;height:min(62vh,540px);min-height:380px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);touch-action:manipulation}
.arena.sky{background:linear-gradient(180deg,#e0f2fe 0%,#f0f9ff 60%,#ecfdf5 100%)}
.arena.sky:after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,#f87171 0 14px,#fff 14px 28px);opacity:.8}
.bubble{position:absolute;top:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 12px;min-height:62px;border-radius:999px;font-weight:900;font-size:1rem;line-height:1.4;color:#0c4a6e;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.95) 0 12%,rgba(255,255,255,.35) 13% 30%,transparent 31%),linear-gradient(160deg,#bae6fd,#7dd3fc 55%,#38bdf8);
  border:2px solid rgba(255,255,255,.85);box-shadow:0 8px 18px rgba(14,116,144,.25),inset 0 -6px 12px rgba(2,132,199,.25);will-change:transform;user-select:none}
.bubble:active{filter:brightness(.95)}
.bubble.pop{animation:pop .35s forwards}
.bubble.good{background:linear-gradient(160deg,#bbf7d0,#4ade80);color:#14532d}
.bubble.badb{background:linear-gradient(160deg,#fecaca,#f87171);color:#7f1d1d}
@keyframes pop{to{transform:var(--tf) scale(1.5);opacity:0}}

.arena.range{background:
  linear-gradient(180deg,rgba(255,255,255,.0),rgba(255,255,255,.0)),
  repeating-linear-gradient(180deg,#fff7ed 0 calc(25% - 2px),#fde68a calc(25% - 2px) 25%);cursor:crosshair}
.target{position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;background:#fff;border:2px solid #fecaca;border-radius:999px;font-weight:900;font-size:1rem;box-shadow:0 6px 14px rgba(185,28,28,.15);white-space:nowrap;will-change:transform;user-select:none;cursor:crosshair}
.target .eye{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:radial-gradient(circle,#dc2626 0 18%,#fff 19% 38%,#dc2626 39% 58%,#fff 59% 78%,#dc2626 79%)}
.target.hit{animation:hit .5s forwards}
.target.good{border-color:var(--ok);background:#dcfce7}
.target.badt{border-color:var(--bad);background:#fee2e2}
@keyframes hit{50%{transform:var(--tf) scale(1.2) rotate(-8deg)}100%{transform:var(--tf) scale(.2);opacity:0}}
.shot{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:3px solid #dc2626;pointer-events:none;animation:shot .45s forwards;z-index:20}
@keyframes shot{to{transform:scale(4);opacity:0}}

/* True / False */
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tfb{border-radius:18px;padding:18px 10px;font-size:1.35rem;font-weight:900;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 8px 0 rgba(0,0,0,.15);transition:transform .1s}
.tfb:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.15)}
.tfb b{font-size:2.2rem;line-height:1}
.tfb.t{background:linear-gradient(160deg,#22c55e,#15803d)}
.tfb.f{background:linear-gradient(160deg,#f87171,#b91c1c)}
.tfb.dim{opacity:.35}
.tfb.mark{outline:4px solid var(--gold2);outline-offset:3px}
.tfq{min-height:150px;display:flex;align-items:center;justify-content:center;font-size:1.3rem}

/* Goal */
.pitch{position:relative;height:300px;border-radius:var(--r);overflow:hidden;margin-bottom:12px;border:1px solid var(--line);
  background:repeating-linear-gradient(90deg,#22a356 0 40px,#1f9a50 40px 80px)}
.pitch .box{position:absolute;left:4%;right:4%;bottom:-2px;height:42%;border:3px solid rgba(255,255,255,.7);border-bottom:0}
.goal{position:absolute;left:12%;right:12%;top:8%;height:52%;border:7px solid #fff;border-bottom:0;border-radius:6px 6px 0 0;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 2px,transparent 2px 13px),repeating-linear-gradient(-45deg,rgba(255,255,255,.28) 0 2px,transparent 2px 13px),rgba(0,0,0,.08);box-shadow:0 6px 0 rgba(0,0,0,.08)}
.goal.net{animation:net .5s}
@keyframes net{30%{transform:scale(1.03,1.05)}60%{transform:scale(.99)}}
.corner{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--gold2);color:#3b2a06;font-weight:900;display:grid;place-items:center;font-size:.95rem;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:2}
.keeper{position:absolute;left:50%;top:60%;width:64px;height:84px;margin:-84px 0 0 -32px;transition:transform .45s cubic-bezier(.2,.8,.3,1);z-index:3;animation:sway 1.6s ease-in-out infinite}
.keeper.dive{animation:none}
@keyframes sway{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
.ball{position:absolute;left:50%;top:86%;width:38px;height:38px;margin:-19px 0 0 -19px;font-size:34px;line-height:38px;text-align:center;z-index:4;transition:left .55s ease-out,top .55s ease-out,transform .55s ease-out}
.ball.fly{transform:scale(.62) rotate(540deg)}
.bigmsg{position:absolute;left:50%;top:38%;margin-left:-130px;width:260px;padding:6px 0;border-radius:16px;background:rgba(5,59,46,.82);text-align:center;font-size:1.9rem;font-weight:900;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.25);z-index:6;transform:scale(.3);opacity:0;transition:.3s}
.bigmsg.show{transform:scale(1);opacity:1}
.gopts .opt .k{background:var(--gold2);color:#3b2a06}

/* Genius */
.timer{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.timer .bar{flex:1;height:14px;border-radius:99px;background:#e2efe8;overflow:hidden}
.timer .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--em5),var(--gold2));transition:width .2s linear}
.timer .bar i.low{background:linear-gradient(90deg,#f97316,#dc2626)}
.timer .sec{width:52px;height:52px;border-radius:50%;background:var(--em8);color:#fff;font-weight:900;font-size:1.2rem;display:grid;place-items:center;flex-shrink:0;border:3px solid var(--gold2)}
.timer .sec.low{background:var(--bad);animation:pulse .6s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}

/* Memory */
.mround{text-align:center;font-weight:800;color:var(--muted);margin-bottom:10px}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:700px){.mgrid{grid-template-columns:repeat(2,1fr)}}
.mcard{perspective:900px;height:118px}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.mcard.open .in{transform:rotateY(180deg)}
.mcard .fr,.mcard .bk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:8px;text-align:center}
.mcard .fr{background:linear-gradient(145deg,var(--em8),var(--em6));border:2px solid var(--gold2);color:var(--gold2);font-size:2rem;font-weight:900;box-shadow:0 6px 14px rgba(6,95,70,.2)}
.mcard .fr img{width:56px;height:56px;border-radius:50%;object-fit:cover;opacity:.9;border:2px solid var(--gold2)}
.mcard .bk{transform:rotateY(180deg);background:#fff;border:2px solid var(--line);flex-direction:column;gap:4px;font-weight:800;font-size:.86rem;line-height:1.5}
.mcard .bk em{font-style:normal;font-size:.68rem;padding:1px 9px;border-radius:99px;font-weight:900}
.mcard.q .bk em{background:var(--em0);color:var(--em7)}
.mcard.a .bk em{background:var(--gold0);color:#8a6512}
.mcard.a .bk{background:#fffdf6}
.mcard.done .bk{border-color:var(--ok);background:#dcfce7}
.mcard.miss .bk{border-color:var(--bad);background:#fee2e2}
.mcard.done{animation:glow .5s}
@keyframes glow{50%{transform:scale(1.05)}}

/* Results */
.res{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 18px;text-align:center;box-shadow:0 10px 30px rgba(6,95,70,.08);animation:popin .4s}
@keyframes popin{from{transform:scale(.9);opacity:0}}
.ring{width:150px;height:150px;border-radius:50%;margin:6px auto 10px;display:grid;place-items:center;background:conic-gradient(var(--em5) calc(var(--p)*1%),#e5efe9 0)}
.ring div{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center;align-content:center}
.ring b{font-size:2rem;font-weight:900;color:var(--em8);line-height:1}
.ring span{font-size:.8rem;color:var(--muted);font-weight:700}
.stars{font-size:2rem;letter-spacing:4px;margin-bottom:4px}
.res h3{font-size:1.3rem;font-weight:900;color:var(--em9)}
.res .sub{color:var(--muted);font-weight:700;margin:4px 0 14px}
.send{background:var(--em0);border:1px dashed var(--em5);border-radius:16px;padding:14px;margin:14px 0}
.send label{display:block;font-weight:800;margin-bottom:8px;color:var(--em8)}
.send input{width:100%;font-family:inherit;font-size:1rem;padding:11px 14px;border-radius:12px;border:2px solid var(--line);outline:none;text-align:center;font-weight:700}
.send input:focus{border-color:var(--em5)}
.send .warn{color:var(--bad);font-weight:800;font-size:.85rem;margin-top:6px;display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:900;font-size:1rem;transition:.15s}
.btn.wa{background:#25d366;color:#fff;width:100%;margin-top:10px;box-shadow:0 6px 0 #1a9e4b}
.btn.wa:active{transform:translateY(3px);box-shadow:0 3px 0 #1a9e4b}
.btn.pri{background:var(--em7);color:#fff}
.btn.sec{background:#fff;border:2px solid var(--line);color:var(--em8)}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.review{text-align:right;margin-top:16px}
.review h4{font-weight:900;color:var(--bad);margin-bottom:8px}
.rv{border:1px solid #fde2e2;background:#fff8f8;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:.9rem;line-height:1.7}
.rv p{font-weight:800}
.rv .y{color:var(--bad)} .rv .c{color:var(--ok);font-weight:800}

footer{text-align:center;color:var(--muted);font-size:.82rem;padding:22px 16px 30px;font-weight:700}
footer b{color:var(--em8)}

.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:90;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);opacity:0;background:var(--em9);color:#fff;font-weight:800;padding:10px 18px;border-radius:12px;transition:.25s;z-index:99}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

    const c = el("button","gcard");
    const ic = el("div","ic",g.icon); ic.style.background = g.bg;
    const tx = el("div");
    tx.appendChild(el("h3","",g.title)); tx.appendChild(el("p","",g.desc));
    tx.appendChild(el("span","tag", g.key==="memory" ? AR(n)+" زوجًا من البطاقات" : AR(n)+" سؤالًا"));
    c.appendChild(ic); c.appendChild(tx);
    c.onclick = () => startGame(g);
    grid.appendChild(c);
  });
}

function toMenu(){ stopAll(); $("game").style.display="none"; $("menu").style.display="block"; window.scrollTo({top:0}); }

function startGame(g){
  stopAll(); G = g;
  $("menu").style.display="none"; $("game").style.display="block";
  $("gTitle").textContent = g.icon + " " + g.title;
  window.scrollTo({top:0});
  if (g.key === "memory") return startMemory();
  const qs = shuffle(LESSON.games[g.key]);
  S = {alive:true, qs, i:0, ok:0, bad:0, wrong:[], t0:Date.now(), total:qs.length};
  updateBar(); nextQ();
}
function updateBar(){
  $("cOk").textContent = "✔ " + AR(S.ok); $("cBad").textContent = "✘ " + AR(S.bad);
  $("pBar").style.width = (S.i / S.total * 100) + "%";
}
function nextQ(){
  stopAll(); S.alive = true;
  if (S.i >= S.total) return showResult();
  updateBar();
  const q = S.qs[S.i];
  ({bubbles:qBubbles, shooting:qShooting, tf:qTF, goal:qGoal, genius:qGenius})[G.key](q);
}
function answer(ok, q, chosen, delayOk, delayBad){
  if (!S.alive) return; S.alive = false;
  if (raf) cancelAnimationFrame(raf); raf = null;
  timers.forEach(clearTimeout); timers.forEach(clearInterval); timers = [];
  const correct = q.options[q.ans];
  if (ok) S.ok++; else { S.bad++; S.wrong.push({q:q.q, y:chosen, c:correct}); }
  feedback(ok, ok ? "" : "الإجابة الصحيحة: " + correct);
  if (!ok){ const qb=document.querySelector(".qbox"); if(qb){qb.classList.remove("shake"); void qb.offsetWidth; qb.classList.add("shake");} }
  S.i++; updateBar();
  const h = setTimeout(nextQ, ok ? (delayOk||1100) : (delayBad||2100));
  timers.push(h);
}
function qBox(q, extraCls){
  const b = el("div","qbox"+(extraCls?" "+extraCls:""));
  b.appendChild(el("span","qn","سؤال "+AR(S.i+1)+" من "+AR(S.total)));
  b.appendChild(document.createTextNode(q.q));
  return b;
}

/* ---------- 1) Falling bubbles ---------- */
function qBubbles(q){
  const st = $("stage"); st.innerHTML = "";
  st.appendChild(qBox(q));
  const ar = el("div","arena sky"); st.appendChild(ar);
  const W = ar.clientWidth, H = ar.clientHeight;
  const lanes = W >= 640 ? 4 : 2;
  const laneW = W / lanes;
  const opts = shuffle(q.options.map((t,i)=>({t, ok:i===q.ans})));
  const items = opts.map((o,k) => {
    const b = el("div","bubble",o.t);
    const lane = lanes === 4 ? k : k % 2;
    b.style.width = (laneW - 14) + "px";
    b.style.left = (lane*laneW + 7) + "px";
    ar.appendChild(b);
    const h = b.offsetHeight;
    const y = lanes === 4 ? -h - k*45 : -h - k*(h*0.85);
    const it = {b, o, y, h, wob: Math.random()*6.28, dead:false};
    const hitFn = ev => {
      ev.preventDefault();
      if (!S.alive || it.dead) return;
      it.dead = true;
      b.classList.add(o.ok ? "good" : "badb"); b.classList.add("pop");
      if (!o.ok) items.forEach(x => { if (x.o.ok) x.b.classList.add("good"); });
      answer(o.ok, q, o.t);
    };
    b.addEventListener("pointerdown", hitFn);
    return it;
  });
  const speed = H / 9.5;     // px per second
  let last = performance.now();
  const loop = now => {
    if (!S.alive) return;
    const dt = Math.min(.05,(now-last)/1000); last = now;
    for (const it of items){
      if (it.dead) continue;
      it.y += speed*dt; it.wob += dt*2.4;
      const tf = `translate(${Math.sin(it.wob)*5}px, ${it.y}px)`;
      it.b.style.transform = tf; it.b.style.setProperty("--tf", tf);
      if (it.y > H){
        it.dead = true; it.b.style.display = "none";
        if (it.o.ok){ answer(false, q, "سقطت الفقاعة الصحيحة ⏬"); return; }
      }
    }
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
}

/* ---------- 2) Target shooting ---------- */
function qShooting(q){
  const st = $("stage"); st.innerHTML = "";
  st.appendChild(qBox(q));
  const ar = el("div","arena range"); st.appendChild(ar);
  const W = ar.clientWidth, H = ar.clientHeight, rowH = H/4;
  const opts = shuffle(q.options.map((t,i)=>({t, ok:i===q.ans})));
  const items = opts.map((o,k) => {
    const t = el("div","target"); t.appendChild(el("span","eye")); t.appendChild(el("span","",o.t));
    ar.appendChild(t);
    const w = Math.min(t.offsetWidth, W-8), h = t.offsetHeight;
    if (t.offsetWidth > W-8){ t.style.whiteSpace="normal"; t.style.width=(W-8)+"px"; }
    const it = {t, o, w, h, x: Math.random()*(W-w), y: k*rowH + (rowH-h)/2, v: (55+Math.random()*55) * (Math.random()<.5?-1:1) * Math.max(.7, W/700), dead:false};
    t.addEventListener("pointerdown", ev => {
      ev.preventDefault();
      if (!S.alive || it.dead) return;
      const r = ar.getBoundingClientRect(); const s = el("div","shot"); s.style.left=(ev.clientX-r.left)+"px"; s.style.top=(ev.clientY-r.top)+"px"; ar.appendChild(s); setTimeout(()=>s.remove(),500);
      it.dead = true; t.classList.add(o.ok ? "good" : "badt"); t.classList.add("hit");
      if (!o.ok) items.forEach(x => { if (x.o.ok) x.t.classList.add("good"); });
      answer(o.ok, q, o.t);
    });
    return it;
  });
  ar.addEventListener("pointerdown", ev => {
    if (ev.target !== ar) return;
    const r = ar.getBoundingClientRect(); const s = el("div","shot"); s.style.left=(ev.clientX-r.left)+"px"; s.style.top=(ev.clientY-r.top)+"px"; ar.appendChild(s); setTimeout(()=>s.remove(),500); sTap();
  });
  let last = performance.now();
  const loop = now => {
    if (!S.alive) return;
    const dt = Math.min(.05,(now-last)/1000); last = now;
    for (const it of items){
      if (it.dead) continue;
      it.x += it.v*dt;
      if (it.x < 0){ it.x = 0; it.v = -it.v; }
      if (it.x > W - it.w){ it.x = Math.max(0, W - it.w); it.v = -it.v; }
      const tf = `translate(${it.x}px, ${it.y}px)`;
      it.t.style.transform = tf; it.t.style.setProperty("--tf", tf);
    }
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
}

/* ---------- 3) True / False ---------- */
function qTF(q){
  const st = $("stage"); st.innerHTML = "";
  st.appendChild(qBox(q, "tfq"));
  const wrap = el("div","tf");
  const mk = (cls, sym, label, idx) => {
    const b = el("button","tfb "+cls); b.appendChild(el("b","",sym)); b.appendChild(el("span","",label));
    b.onclick = () => {
      if (!S.alive) return;
      const ok = idx === q.ans;
      [...wrap.children].forEach((x,j) => { if (j !== q.ans) x.classList.add("dim"); else x.classList.add("mark"); });
      answer(ok, q, q.options[idx]);
    };
    return b;
  };
  wrap.appendChild(mk("t","✔","صح",0));
  wrap.appendChild(mk("f","✘","خطأ",1));
  st.appendChild(wrap);
}

/* ---------- 4) Goal scoring ---------- */
const KEEPER_SVG = '<svg viewBox="0 0 64 84" width="64" height="84"><circle cx="32" cy="14" r="10" fill="#f2c9a0"/><path d="M22 12a10 10 0 0 1 20 0z" fill="#1f2937"/><rect x="18" y="25" width="28" height="30" rx="8" fill="#f59e0b"/><text x="32" y="46" text-anchor="middle" font-size="14" font-weight="900" fill="#fff" font-family="Cairo">1</text><rect x="2" y="26" width="18" height="8" rx="4" fill="#f59e0b"/><rect x="44" y="26" width="18" height="8" rx="4" fill="#f59e0b"/><circle cx="4" cy="30" r="6" fill="#16a34a"/><circle cx="60" cy="30" r="6" fill="#16a34a"/><rect x="21" y="54" width="9" height="26" rx="4" fill="#111827"/><rect x="34" y="54" width="9" height="26" rx="4" fill="#111827"/></svg>';
const CORNERS = [{x:76,y:22},{x:24,y:22},{x:76,y:48},{x:24,y:48}]; // percentages inside pitch
function qGoal(q){
  const st = $("stage"); st.innerHTML = "";
  st.appendChild(qBox(q));
  const p = el("div","pitch");
  p.appendChild(el("div","box"));
  const goal = el("div","goal"); p.appendChild(goal);
  CORNERS.forEach((c,i)=>{ const d=el("div","corner",AR(i+1)); d.style.left=c.x+"%"; d.style.top=c.y+"%"; p.appendChild(d); });
  const kp = el("div","keeper"); kp.innerHTML = KEEPER_SVG; p.appendChild(kp);
  const ball = el("div","ball","⚽"); p.appendChild(ball);
  const msg = el("div","bigmsg"); p.appendChild(msg);
  st.appendChild(p);
  const opts = shuffle(q.options.map((t,i)=>({t, ok:i===q.ans})));
  const box = el("div","opts gopts");
  opts.forEach((o,k) => {
    const b = el("button","opt"); b.appendChild(el("span","k",AR(k+1))); b.appendChild(el("span","",o.t));
    b.onclick = () => {
      if (!S.alive || box.dataset.lock) return;
      box.dataset.lock = 1;
      [...box.children].forEach(x => x.disabled = true);
      b.classList.add(o.ok ? "right" : "wrong");
      if (!o.ok) opts.forEach((x,j) => { if (x.ok) box.children[j].classList.add("right"); });
      const c = CORNERS[k];
      // keeper dives: to the same corner when the answer is wrong, to the far side when correct
      const kc = o.ok ? CORNERS[[1,0,3,2][k]] : c;
      kp.classList.add("dive");
      const pw = p.clientWidth, ph = p.clientHeight;
      const dx = (kc.x-50)/100*pw, dy = (kc.y-46)/100*ph;
      kp.style.transform = `translate(${dx}px, ${dy}px) rotate(${kc.x>50?55:-55}deg)`;
      ball.classList.add("fly");
      if (o.ok){ ball.style.left = c.x+"%"; ball.style.top = c.y+"%"; }
      else { ball.style.left = c.x+"%"; ball.style.top = (c.y+4)+"%"; later(()=>{ ball.style.left=(c.x>50?95:5)+"%"; ball.style.top="80%"; }, 520); }
      later(() => {
        msg.textContent = o.ok ? "جووول! ⚽" : "تصدّى الحارس! 🧤";
        msg.classList.add("show");
        if (o.ok){ goal.classList.add("net"); }
      }, 480);
      later(() => answer(o.ok, q, o.t, 1300, 2100), 600);
    };
    box.appendChild(b);
  });
  st.appendChild(box);
}

/* ---------- 5) Genius challenge ---------- */
const GENIUS_TIME = 30;
function qGenius(q){
  const st = $("stage"); st.innerHTML = "";
  const tm = el("div","timer"); const bar = el("div","bar"); const fill = el("i"); bar.appendChild(fill);
  const sec = el("div","sec",AR(GENIUS_TIME)); tm.appendChild(sec); tm.appendChild(bar);
  st.appendChild(tm);
  st.appendChild(qBox(q));
  const opts = shuffle(q.options.map((t,i)=>({t, ok:i===q.ans})));
  const box = el("div","opts");
  const letters = ["أ","ب","ج","د"];
  const reveal = () => opts.forEach((x,j) => { box.children[j].disabled = true; if (x.ok) box.children[j].classList.add("right"); });
  opts.forEach((o,k) => {
    const b = el("button","opt"); b.appendChild(el("span","k",letters[k])); b.appendChild(el("span","",o.t));
    b.onclick = () => { if (!S.alive) return; reveal(); if (!o.ok) b.classList.add("wrong"); answer(o.ok, q, o.t); };
    box.appendChild(b);
  });
  st.appendChild(box);
  const t0 = Date.now();
  const iv = setInterval(() => {
    if (!S.alive){ clearInterval(iv); return; }
    const left = Math.max(0, GENIUS_TIME - (Date.now()-t0)/1000);
    fill.style.width = (left/GENIUS_TIME*100) + "%";
    sec.textContent = AR(Math.ceil(left));
    const low = left <= 5; fill.classList.toggle("low", low); sec.classList.toggle("low", low);
    if (left <= 0){ clearInterval(iv); reveal(); answer(false, q, "انتهى الوقت ⏰"); }
  }, 100);
  timers.push(iv);
}

/* ---------- 6) Memory ---------- */
const PAIRS_PER_ROUND = 5;
function startMemory(){
  const pairs = shuffle(LESSON.games.memory);
  const rounds = [];
  for (let i=0;i<pairs.length;i+=PAIRS_PER_ROUND) rounds.push(pairs.slice(i,i+PAIRS_PER_ROUND));
  S = {alive:true, mem:true, rounds, r:0, ok:0, bad:0, matched:0, total:pairs.length, i:0, wrong:[], t0:Date.now()};
  memRound();
}
function memRound(){
  const st = $("stage"); st.innerHTML = "";
  $("cOk").textContent = "✔ " + AR(S.matched); $("cBad").textContent = "✘ " + AR(S.bad);
  $("pBar").style.width = (S.matched / S.total * 100) + "%";
  st.appendChild(el("div","mround","الجولة "+AR(S.r+1)+" من "+AR(S.rounds.length)+" — طابق كل بطاقة سؤال مع بطاقة إجابتها"));
  const grid = el("div","mgrid"); st.appendChild(grid);
  const cards = shuffle(S.rounds[S.r].flatMap((p,idx) => [{id:idx, kind:"q", t:p.q, p}, {id:idx, kind:"a", t:p.a, p}]));
  let open = [], lock = false, found = 0;
  cards.forEach(c => {
    const m = el("div","mcard "+c.kind); const inn = el("div","in");
    const fr = el("div","fr"); const img = document.createElement("img"); img.src="../logo.jpeg"; img.alt=""; img.onerror=()=>{fr.textContent="؟";}; fr.appendChild(img);
    const bk = el("div","bk"); bk.appendChild(el("em","",c.kind==="q"?"سؤال":"إجابة")); bk.appendChild(el("span","",c.t));
    inn.appendChild(fr); inn.appendChild(bk); m.appendChild(inn); grid.appendChild(m);
    m.onclick = () => {
      if (lock || m.classList.contains("open") || !S.alive) return;
      m.classList.add("open"); sTap(); open.push({m,c});
      if (open.length < 2) return;
      const [a,b] = open; open = [];
      if (a.c.id === b.c.id && a.c.kind !== b.c.kind){
        a.m.classList.add("done"); b.m.classList.add("done");
        S.matched++; found++; sOk();
        $("cOk").textContent = "✔ " + AR(S.matched); $("pBar").style.width = (S.matched / S.total * 100) + "%";
        if (found === S.rounds[S.r].length){
          later(() => { S.r++; if (S.r < S.rounds.length) memRound(); else showResult(); }, 900);
        }
      } else {
        lock = true; S.bad++; sBad();
        $("cBad").textContent = "✘ " + AR(S.bad);
        a.m.classList.add("miss"); b.m.classList.add("miss");
        later(() => { a.m.classList.remove("open","miss"); b.m.classList.remove("open","miss"); lock = false; }, 1000);
      }
    };
  });
}

/* ---------- Results & WhatsApp ---------- */
function fmtTime(ms){ const s=Math.round(ms/1000); return "\u2066"+AR(Math.floor(s/60))+":"+AR(String(s%60).padStart(2,"0"))+"\u2069"; }
function showResult(){
  stopAll();
  const st = $("stage"); st.innerHTML = "";
  $("pBar").style.width = "100%";
  const time = Date.now() - S.t0;
  let pct, big, small, line;
  if (S.mem){
    const acc = S.total / (S.total + S.bad);
    pct = Math.round(acc*100);
    big = AR(S.matched) + "/" + AR(S.total); small = "زوجًا";
    line = "محاولات غير صحيحة: " + AR(S.bad) + " · الزمن: " + fmtTime(time);
  } else {
    pct = Math.round(S.ok / S.total * 100);
    big = AR(S.ok) + "/" + AR(S.total); small = "إجابة صحيحة";
    line = "الزمن: " + fmtTime(time);
  }
  const stars = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0;
  const title = ["حاول مرة أخرى، تستطيع! 💪","بداية جيدة! 🌱","أداء رائع! 🌟","ممتاز يا بطل! 🏆"][stars];
  const r = el("div","res");
  r.appendChild(el("div","stars","⭐".repeat(stars) + "☆".repeat(3-stars)));
  const ring = el("div","ring"); ring.style.setProperty("--p", pct);
  const rin = el("div"); rin.appendChild(el("b","",big)); rin.appendChild(el("span","",small)); ring.appendChild(rin); r.appendChild(ring);
  r.appendChild(el("h3","",title));
  r.appendChild(el("p","sub", G.title + " · " + line));

  const send = el("div","send");
  send.appendChild(el("label","","اكتب اسمك لإرسال نتيجتك إلى الأستاذة ميادة"));
  const inp = document.createElement("input"); inp.type="text"; inp.placeholder="الاسم الثلاثي"; inp.maxLength=60;
  try{ inp.value = localStorage.getItem("mayada_student") || ""; }catch(e){}
  send.appendChild(inp);
  const warn = el("div","warn","من فضلك اكتب اسمك أولًا"); send.appendChild(warn);
  const wa = el("button","btn wa","📤 أرسل النتيجة للأستاذة ميادة على واتساب");
  wa.onclick = () => {
    const name = inp.value.trim();
    if (!name){ warn.style.display="block"; inp.focus(); return; }
    warn.style.display="none";
    try{ localStorage.setItem("mayada_student", name); }catch(e){}
    const lines = [
      "السلام عليكم أستاذة ميادة 🌸",
      "👤 اسم الطالب: " + name,
      "🏫 " + LESSON.grade,
      "📖 الدرس: " + LESSON.plain,
      "🎮 اللعبة: " + G.title
    ];
    if (S.mem){ lines.push("✅ الأزواج المطابقة: " + S.matched + " من " + S.total, "❌ محاولات غير صحيحة: " + S.bad, "📊 الدقة: " + pct + "%"); }
    else { lines.push("✅ النتيجة: " + S.ok + " من " + S.total + " (" + pct + "%)", "❌ الإجابات الخاطئة: " + S.bad); }
    lines.push("⏱️ الزمن: " + (Math.floor(time/60000)) + ":" + String(Math.round(time/1000)%60).padStart(2,"0"), "⭐ التقييم: " + "⭐".repeat(stars || 0) + (stars ? "" : "—"));
    window.open("https://wa.me/" + PHONE + "?text=" + encodeURIComponent(lines.join("\n")), "_blank");
  };
  send.appendChild(wa);
  r.appendChild(send);

  const bt = el("div","btns");
  const again = el("button","btn pri","↻ العب مرة أخرى"); again.onclick = () => startGame(G);
  const menu = el("button","btn sec","اختر لعبة أخرى"); menu.onclick = toMenu;
  bt.appendChild(again); bt.appendChild(menu); r.appendChild(bt);

  if (!S.mem && S.wrong.length){
    const rv = el("div","review"); rv.appendChild(el("h4","","راجع أخطاءك (" + AR(S.wrong.length) + ")"));
    S.wrong.forEach(w => {
      const d = el("div","rv"); d.appendChild(el("p","",w.q));
      const y = el("div","y","إجابتك: " + w.y); const c = el("div","c","الصحيحة: " + w.c);
      d.appendChild(y); d.appendChild(c); rv.appendChild(d);
    });
    r.appendChild(rv);
  }
  st.appendChild(r);
  if (stars >= 2) confetti();
  window.scrollTo({top:0, behavior:"smooth"});
}

buildMenu();
